name: Nurgat Tours - External Reachability Check

# Independent of n8n. Public HTTP reachability only; no secrets or client data.
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: nurgat-external-reachability
  cancel-in-progress: false

jobs:
  reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public services
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local label="$1" url="$2" accepted="$3"
            local status
            echo "::group::Checking ${label}"
            # Do not use curl --fail: protected health endpoints can return 401
            # while still proving the service is reachable.
            if ! status=$(curl --silent --show-error --location --max-time 20 \
              --connect-timeout 10 --retry 2 --retry-delay 3 \
              --output /dev/null --write-out '%{http_code}' "$url"); then
              echo "::error title=${label} connection failure::Could not reach service over HTTPS"
              echo "::endgroup::"
              return 1
            fi
            case "$accepted" in
              public)
                if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
                  echo "PASS: ${label} returned HTTP ${status}"
                else
                  echo "::error title=${label} HTTP failure::Unexpected HTTP ${status}; expected 2xx"
                  echo "::endgroup::"
                  return 1
                fi
                ;;
              protected-health)
                # Supabase /auth/v1/health may require an API key (HTTP 401).
                # 401 means the server responded, not that it was unreachable.
                if [[ "$status" =~ ^2[0-9][0-9]$ || "$status" == '401' ]]; then
                  echo "PASS: ${label} returned HTTP ${status} (401 means authentication required)"
                else
                  echo "::error title=${label} HTTP failure::Unexpected HTTP ${status}; expected 2xx or 401"
                  echo "::endgroup::"
                  return 1
                fi
                ;;
              *)
                echo "::error::Invalid check configuration"
                echo "::endgroup::"
                return 1
                ;;
            esac
            echo "::endgroup::"
          }
          failures=0
          check 'n8n Cloud web interface' 'https://nurgattourszm.app.n8n.cloud/' public || failures=$((failures+1))
          check 'GitHub Pages CEO demo' 'https://junaid-nurgat.github.io/nurgat-command-centre/' public || failures=$((failures+1))
          check 'Supabase Auth health' 'https://ysakhagnlmhwbbmetjjc.supabase.co/auth/v1/health' protected-health || failures=$((failures+1))
          if (( failures > 0 )); then
            echo "::error title=Nurgat availability monitor::${failures} of 3 service checks failed"
            exit 1
          fi
          echo "All three external checks passed. Does not guarantee workflows, sign-in, or APIs function correctly."
