name: Lite browser QA (fictional / mocked)
on:
  pull_request:
    paths:
      - index.html
      - tests/lite-save-browser.test.cjs
      - tests/lite-ai-handoff-browser.test.cjs
      - tests/lite-one-click-browser.test.cjs
      - tests/lite-fictional-inbox-browser.test.cjs
      - tests/lite-monitor-browser.test.cjs
      - tests/lite-monitor-readonly-browser.test.cjs
      - tests/monitoring-readonly.test.mjs
      - supabase/functions/nurgat-monitor-readonly/index.ts
      - supabase/functions/_shared/monitoring-readonly.mjs
      - staging-handoff.html
      - tests/staging-smoke-browser.test.cjs
      - .github/workflows/lite-browser-qa.yml
  workflow_dispatch:
jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium for the test runner
        run: npx playwright install --with-deps chromium
      - name: Verify isolated read-only bridge security contract
        run: node tests/monitoring-readonly.test.mjs
      - name: Run real-browser UI test with mocked Supabase requests
        run: |
          node tests/lite-save-browser.test.cjs
          node tests/lite-ai-handoff-browser.test.cjs
          node tests/lite-one-click-browser.test.cjs
          node tests/lite-fictional-inbox-browser.test.cjs
          node tests/lite-monitor-browser.test.cjs
          node tests/lite-monitor-readonly-browser.test.cjs
          node tests/staging-smoke-browser.test.cjs
