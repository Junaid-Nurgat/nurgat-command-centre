name: Lite browser QA (fictional / mocked)
on:
  pull_request:
    paths:
      - index.html
      - tests/lite-save-browser.test.cjs
      - .github/workflows/lite-browser-qa.yml
  workflow_dispatch:
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium for the test runner
        run: npx playwright install --with-deps chromium
      - name: Run real-browser UI test with mocked Supabase requests
        run: node tests/lite-save-browser.test.cjs
